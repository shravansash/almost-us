<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almost Us — Before You Dive In</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #FAFAF9;
  --text: #1F2937;
  --red: #9B3A3A;
  --soft: #9A8C98;
  --buy: #F4B266;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: var(--bg);
  font-family: "Times New Roman", Times, serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--text);
}

.container {
  max-width: 780px;
  padding: 2rem;
  animation: slideUp 1.2s ease forwards;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(40px); }
  to   { opacity: 1; transform: translateY(0); }
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.2rem, 5vw, 3.2rem);
  line-height: 1.3;
  margin-bottom: 2rem;
}

.sub {
  font-size: 1.05rem;
  color: #4B5563;
  margin-bottom: 3.2rem;
}

.buttons {
  display: flex;
  gap: 1.6rem;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  padding: 1.05rem 2rem;
  border-radius: 999px;
  border: none;
  font-size: 0.95rem;
  cursor: pointer;
  font-family: "Times New Roman", Times, serif;
  transition: transform 0.5s ease, box-shadow 0.5s ease;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.16);
}

.checkout {
  background: var(--buy);
  color: #111827;
}

.peek {
  background: var(--soft);
  color: #111827;
}
</style>
</head>

<body>

<div class="container">
  <h1>
    Whoa.<br>
    You’re about to jump into this story without even seeing how it feels.
  </h1>

  <div class="sub">
    Some people trust the fall.<br>
    Some people like to look down first.
  </div>

  <div class="buttons">
    <button class="checkout" onclick="goCheckout()">
      Yes, take me straight to checkout
    </button>

    <button class="peek" onclick="goPeek()">
      Let me take a peek & feel the weight of it
    </button>
  </div>
</div>

<script>
function goCheckout() {
  window.location.href = "checkout.html";
}

function goPeek() {
  window.location.href = "sneak-peek.html";
}
</script>

</body>
</html>
